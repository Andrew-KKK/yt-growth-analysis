name: YouTube Daily Snapshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      n8n_trigger:
        description: '是否由 n8n 觸發'
        required: false
        default: 'false'
      skip_cooldown:
        description: '⚠️ 強制執行 (忽略冷卻限制)'
        required: false
        type: boolean
        default: false


jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 從 3.10 升級到 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_yt_data.py and record result
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_API_KEY_2: ${{ secrets.YT_API_KEY_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          N8N_TRIGGER: ${{ github.event.inputs.n8n_trigger == 'true' && 'true' || '' }}
          SKIP_COOLDOWN: ${{ github.event.inputs.skip_cooldown == 'true' && 'true' || 'false' }}
        run: python fetch_yt_data.py
